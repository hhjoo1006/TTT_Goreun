[build]
  command = "npm run build:netlify"
  publish = "dist/netlify"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/landing"
  to = "/"
  status = 301

[[redirects]]
  from = "/landing/*"
  to = "/"
  status = 301
